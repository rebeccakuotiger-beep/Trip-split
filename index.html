    x.fillStyle='#0f766e';x.fillRect(0,0,n,n);x.font=Math.round(n*0.6)+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🧳',n/2,n*0.54);
    return c.toDataURL('image/png');}
  try{
    var a=document.createElement('link');a.rel='apple-touch-icon';a.href=icon(180);document.head.appendChild(a);

    var l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);

})();

<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1e2125;--ink:#efece6;--mut:#9a958c;--line:#2e3237;--pri:#2dd4bf;--pri2:#16312e;--pos:#2dd4bf;--neg:#fb923c;--warn:#2b2417}}

html{scroll-padding-top:68px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;touch-action:manipulation}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 14px;min-height:54px;display:flex;gap:8px;align-items:center}
header b{font-size:18px;margin-right:auto;white-space:nowrap}
.nav{display:none;gap:6px;overflow-x:auto}

main{max-width:560px;margin:0 auto;padding:14px 14px 48px}
section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:17px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
input,select{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:-1px}
button{font:inherit;font-size:16px;min-height:48px;border:0;border-radius:12px;padding:10px 16px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
button:active{opacity:.8}
button:disabled{opacity:.5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.p{color:#06201c}}
button.g{background:var(--pri2);color:var(--pri)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;background:var(--pri2);color:var(--pri);border-radius:99px;font-size:15px}
.chip i{font-style:normal;cursor:pointer;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--card)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;background:transparent;color:var(--mut);min-height:44px;padding:8px 6px;font-size:15px}
.seg button.on{background:var(--pri);color:#fff}
.who{display:flex;flex-wrap:wrap;gap:8px}

.pay b{font-size:16px}.pay .ar{color:var(--pri)}.pay .v{margin-left:auto;font-weight:700;font-size:17px}

.tools{display:flex;gap:8px;margin-top:12px}.tools button{flex:1}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:14px;font-size:15px;display:none;max-width:528px;margin:0 auto}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:center;justify-content:center;padding:24px}
#dlg>div{background:var(--card);border-radius:18px;padding:20px;max-width:360px;width:100%}
.code{font-size:26px;letter-spacing:4px;font-weight:800;color:var(--pri)}
@media (min-width:700px){main{max-width:720px;padding:24px 24px 56px}section{padding:22px}}
@media (min-width:960px){main{max-width:1040px}.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}}

<body>
<header><b id="ttl">🧳 旅伴分帳本</b><span class="nav" id="nav"><a href="#m">成員</a><a href="#add">記帳</a><a href="#log">明細</a><a href="#sum">結算</a></span></header>
<main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut,setPersistence,indexedDBLocalPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,collection,getDocs,onSnapshot,arrayUnion}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCyOG3urr9sEsr50t00Wqw2wfg5GH0-Zv4",
  authDomain:"trip-split-rbk.firebaseapp.com",
  projectId:"trip-split-rbk",
  appId:"1:496428287801:web:605901dafef85a30fdcae8"
};

const configured=!firebaseConfig.apiKey.startsWith('貼上');
const app=configured?initializeApp(firebaseConfig):null;
const auth=configured?getAuth(app):null;
const fdb=configured?getFirestore(app):null;
// 保持登入：存在裝置上，關閉 App 或瀏覽器後仍維持登入
if(auth)setPersistence(auth,indexedDBLocalPersistence).catch(()=>setPersistence(auth,browserLocalPersistence).catch(()=>{}));
const wrap=x=>({id:x.id,exists:x.exists(),data:()=>x.data()});
const db={
  doc:p=>{const r=doc(fdb,p);return{path:p,get:async()=>wrap(await getDoc(r)),set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r),onSnapshot:(n,e)=>onSnapshot(r,x=>n(wrap(x)),e)}},
  collection:p=>{const c=collection(fdb,p);const w=q=>({docs:q.docs.map(wrap),size:q.size});return{get:async()=>w(await getDocs(c)),onSnapshot:(n,e)=>onSnapshot(c,q=>n(w(q)),e)}}
};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CUR=[['TWD','新台幣'],['JPY','日圓'],['USD','美元'],['KRW','韓元'],['EUR','歐元'],['THB','泰銖'],['CNY','人民幣'],['HKD','港幣'],['GBP','英鎊'],['SGD','新加坡幣'],['MYR','馬幣'],['VND','越南盾'],['AUD','澳幣']];
const DEF={TWD:1,JPY:0.21,USD:31,KRW:0.023,EUR:36,THB:0.9,CNY:4.3,HKD:4,GBP:41,SGD:24,MYR:7.2,VND:0.0012,AUD:20};
const dec=c=>['JPY','KRW','VND'].includes(c)?0:2;
const fmtC=(n,c)=>c+' '+(n/100).toLocaleString('zh-TW',{minimumFractionDigits:dec(c),maximumFractionDigits:dec(c)});
let S={members:[],expenses:[],base:'TWD',name:'',owner:null};
const fmt=c=>fmtC(c,S.base);
const conv=e=>Math.round(e.cents*(e.cur&&e.cur!==S.base?e.rate:1));
let me={id:null,name:''},canW=true,trip=null,unsubs=[],type='split',rates={},fresh=false,lastBase=null;
const lastGet=()=>{try{return localStorage.getItem('lastTrip')}catch(e){return null}};
const lastSet=c=>{try{c?localStorage.setItem('lastTrip',c):localStorage.removeItem('lastTrip')}catch(e){}};
const fmtCode=c=>c.slice(0,4)+'-'+c.slice(4);
const norm=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,'');
const genCode=()=>{const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789',r=new Uint8Array(8);crypto.getRandomValues(r);return[...r].map(x=>a[x%a.length]).join('')};
let tt;function msg(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',3200)}
function ask(t){return new Promise(r=>{$('dt').textContent=t;$('dlg').style.display='flex';$('dy').onclick=()=>{$('dlg').style.display='none';r(true)};$('dn').onclick=()=>{$('dlg').style.display='none';r(false)}})}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e2){return false}}}
const tripRef=()=>db.doc('trips/'+trip);
const mineRef=c=>db.doc('users/'+me.id+'/trips/'+c);

function calc(){
  const paid={},owe={},pers={};
  S.members.forEach(m=>{paid[m]=0;owe[m]=0;pers[m]=0});
  let total=0,shared=0;
  S.expenses.forEach(e0=>{const e={...e0,cents:conv(e0)};
    total+=e.cents;
    if(e.type==='personal'){if(e.payer in pers)pers[e.payer]+=e.cents;return}
    shared+=e.cents;
    if(e.payer in paid)paid[e.payer]+=e.cents;
    const w=(e.who||[]).filter(x=>x in owe);if(!w.length)return;
    const base=Math.floor(e.cents/w.length);let rem=e.cents-base*w.length;
    w.forEach(x=>{owe[x]+=base+(rem-->0?1:0)});
  });
  const bal={};S.members.forEach(m=>bal[m]=paid[m]-owe[m]);
  const cr=[],dbt=[];
  S.members.forEach(m=>{if(bal[m]>0)cr.push([m,bal[m]]);else if(bal[m]<0)dbt.push([m,-bal[m]])});
  cr.sort((a,b)=>b[1]-a[1]);dbt.sort((a,b)=>b[1]-a[1]);
  const tx=[];let i=0,j=0;
  while(i<cr.length&&j<dbt.length){
    const a=Math.min(cr[i][1],dbt[j][1]);
    if(a>0)tx.push({from:dbt[j][0],to:cr[i][0],c:a});
    cr[i][1]-=a;dbt[j][1]-=a;
    if(cr[i][1]===0)i++;if(dbt[j][1]===0)j++;
  }
  return{paid,owe,pers,bal,tx,total,shared};
}

function render(){
  if(!trip)return;
  const pv=$('payer').value;
  const un=new Set([...document.querySelectorAll('#who input:not(:checked)')].map(x=>x.value));
  $('chips').innerHTML=S.members.length?S.members.map((m,i)=>`<span class="chip">${esc(m)}<i data-rm="${i}">×</i></span>`).join(''):'<div class="empty" style="width:100%">先新增至少 2 位成員</div>';
  $('payer').innerHTML=S.members.map(m=>`<option>${esc(m)}</option>`).join('');
  $('payer').value=S.members.includes(pv)?pv:(S.members.includes(me.name)?me.name:(S.members[0]||''));
  $('who').innerHTML=S.members.map(m=>`<label><input type="checkbox" value="${esc(m)}" ${un.has(m)?'':'checked'}>${esc(m)}</label>`).join('');
  $('whoBox').style.display=type==='split'?'':'none';
  $('hint').textContent=type==='split'?'金額會平均分給勾選的人，付款人若沒勾選則視為替大家墊付。':'個人支出只記錄，不參與互相結算。';
  $('base').value=S.base;$('base').disabled=S.expenses.length>0;
  $('baseHint').textContent=S.expenses.length?'已有消費記錄，無法更改結算幣別':'';
  $('del').style.display=S.owner&&S.owner===me.id?'':'none';
  const L=[...S.expenses].reverse();
  $('list').innerHTML=L.length?L.map(e=>`<div class="item"><div class="ic">${esc((e.cat||'📦').split(' ')[0])}</div><div class="mid"><b>${esc(e.desc)}</b><span class="tag ${e.type==='personal'?'pe':''}">${e.type==='personal'?'個人':'分攤'}</span><small>${esc(e.payer)} 付款${e.type==='split'?' · '+(e.who||[]).length+' 人分攤':''}</small></div><div class="amt">${fmtC(e.cents,e.cur||S.base)}${e.cur&&e.cur!==S.base?`<small>≈ ${fmt(conv(e))}</small>`:''}${e.type==='split'&&(e.who||[]).length?`<small>人均 ${fmt(Math.round(conv(e)/e.who.length))}</small>`:''}</div><button class="del" data-del="${esc(e.id)}">🗑</button></div>`).join(''):'<div class="empty">還沒有消費記錄</div>';
  const r=calc();
  if(S.members.length<2){$('summary').innerHTML='<div class="empty">新增成員並記帳後，這裡會顯示結算結果</div>';return}
  let h=`<div class="big"><div><small>總支出</small><b>${fmt(r.total)}</b></div><div><small>分攤總額</small><b>${fmt(r.shared)}</b></div><div><small>人均分攤</small><b>${fmt(Math.round(r.shared/S.members.length))}</b></div></div>`;
  const bc={};S.expenses.forEach(e=>{const c=e.cur||S.base;bc[c]=(bc[c]||0)+e.cents});const bl=Object.keys(bc);
  if(bl.length>1)h+=`<p style="font-size:13px;color:var(--mut);margin:0 0 12px">各幣別實際花費：${bl.map(c=>fmtC(bc[c],c)).join('、')}</p>`;
  S.members.forEach(m=>{const b=r.bal[m];h+=`<div class="mem"><div class="mh"><b>${esc(m)}</b><span class="${b>0?'pos':b<0?'neg':''}">${b>0?'+':''}${fmt(b)}</span></div><div class="ms"><span>已墊付<b>${fmt(r.paid[m])}</b></span><span>應分攤<b>${fmt(r.owe[m])}</b></span>${r.pers[m]?`<span>個人支出<b>${fmt(r.pers[m])}</b></span>`:''}</div></div>`});
  h+='<h2 style="margin:20px 0 0;font-size:16px">💸 誰該付給誰</h2>';
  h+=r.tx.length?r.tx.map(t=>`<div class="pay"><b>${esc(t.from)}</b><span class="ar">➜</span><b>${esc(t.to)}</b><span class="v">${fmt(t.c)}</span></div>`).join(''):`<div class="empty">${S.expenses.length?'🎉 已經結清，沒有人需要轉帳':'暫無需要結算的款項'}</div>`;
  h+='<p style="font-size:13px;color:var(--mut);margin:12px 0 0">結餘為正＝別人應還給他；為負＝他還需付給別人。轉帳方案已將筆數降到最少。所有結算金額以 '+S.base+' 計。</p>';
  $('summary').innerHTML=h;
}

function setRate(){const c=$('cur').value,show=c!==S.base;$('rateBox').style.display=show?'':'none';
  if(show){$('rateLbl').textContent=`匯率：1 ${c} = ? ${S.base}（預設為概略匯率，請依實際換匯為準）`;$('rate').value=+(rates[c]||DEF[c]/DEF[S.base]).toPrecision(5)}}

function view(v){
  $('loading').style.display=v==='loading'?'':'none';
  $('home').style.display=v==='home'?'':'none';
  $('trip').style.display=v==='trip'?'':'none';
  $('blocked').style.display=v==='blocked'?'':'none';
  $('nav').style.display=v==='trip'?'flex':'none';
  $('ttl').textContent=v==='trip'?'🧳':'🧳 旅伴分帳本';
}
function closeTrip(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];trip=null}
async function loadMine(){
  try{
    const q=await db.collection('users/'+me.id+'/trips').get();
    const L=q.docs.map(d=>d.data()).filter(x=>x&&x.code).sort((a,b)=>(b.ts||0)-(a.ts||0));
    $('mine').innerHTML=L.length?L.map(t=>`<div class="item"><div class="ic">🧳</div><div class="mid"><b>${esc(t.name)}</b><small>旅程碼 ${esc(fmtCode(t.code))}</small></div><button class="g" data-open="${esc(t.code)}">開啟</button></div>`).join(''):'<div class="empty">還沒有旅程，建立或加入一個吧</div>';
  }catch(e){$('mine').innerHTML='<div class="empty">無法讀取旅程清單</div>'}
}
function openTrip(code){
  closeTrip();trip=code;lastSet(code);fresh=true;lastBase=null;S={members:[],expenses:[],base:'TWD',name:'',owner:null};
  $('tcode').textContent=fmtCode(code);$('tname').textContent='載入中…';view('trip');window.scrollTo(0,0);
  unsubs.push(tripRef().onSnapshot(s=>{
    if(!s.exists){$('tname').textContent='此旅程不存在或已被刪除';S.members=[];S.expenses=[];render();return}
    const d=s.data();S.name=d.name;S.base=d.base||'TWD';S.members=d.members||[];S.owner=d.owner;$('tname').textContent=d.name;
    if(fresh){$('cur').value=S.base;fresh=false}
    if(lastBase!==S.base){lastBase=S.base;rates={};setRate()}
    render();
  },e=>msg('讀取失敗：'+e.message)));
  unsubs.push(db.collection('trips/'+code+'/expenses').onSnapshot(q=>{S.expenses=q.docs.map(d=>d.data()).sort((a,b)=>(a.ts||0)-(b.ts||0));render()},e=>msg('讀取失敗：'+e.message)));
}
function goHome(){closeTrip();lastSet(null);view('home');loadMine()}
async function remember(code,name){try{await mineRef(code).set({code,name,ts:Date.now()})}catch(e){}}

$('mk').onclick=async()=>{
  const name=$('tn').value.trim()||'未命名旅程';
  try{
    for(let k=0;k<5;k++){
      const code=genCode(),ref=db.doc('trips/'+code);
      if((await ref.get()).exists)continue;
      await ref.set({name,base:$('tb').value,members:me.name?[me.name]:[],owner:me.id,memberUids:[me.id],ts:Date.now()});
      await remember(code,name);$('tn').value='';openTrip(code);msg('旅程已建立，請把旅程碼分享給同行者');return;
    }
    msg('產生旅程碼失敗，請再試一次');
  }catch(e){msg('建立失敗：'+e.message)}
};
$('jn').onclick=async()=>{
  const code=norm($('jc').value);
  if(code.length!==8){msg('旅程碼是 8 碼英數字');return}
  try{
    const s=await db.doc('trips/'+code).get();
    if(!s.exists){msg('找不到這個旅程碼，請確認後再試');return}
    const d=s.data(),ms=d.members||[];
    if(!(d.memberUids||[]).includes(me.id)){const up={memberUids:arrayUnion(me.id)};if(me.name&&!ms.includes(me.name))up.members=[...ms,me.name];await db.doc('trips/'+code).update(up)}
    await remember(code,d.name);$('jc').value='';openTrip(code);
  }catch(e){msg('加入失敗：'+e.message)}
};
$('mine').onclick=e=>{const c=e.target.dataset.open;if(c)openTrip(c)};
$('back').onclick=goHome;
$('cc').onclick=async()=>{
  const ok=await copyText(`來加入「${S.name}」一起分帳！\n旅程碼：${fmtCode(trip)}\n打開「旅伴分帳本」→ 加入旅程 → 輸入旅程碼`);
  msg(ok?'已複製邀請文字':'複製失敗，請直接把旅程碼 '+fmtCode(trip)+' 傳給同行者');
};
$('leave').onclick=async()=>{
  if(!await ask('離開這個旅程？只會從你的清單移除，資料仍保留給其他人，之後可用旅程碼再加入。'))return;
  try{await mineRef(trip).delete()}catch(e){}
  goHome();
};
$('del').onclick=async()=>{
  if(!await ask('刪除整個旅程？所有成員與消費記錄都會消失，無法復原。'))return;
  try{
    const q=await db.collection('trips/'+trip+'/expenses').get();
    for(const d of q.docs)await db.doc('trips/'+trip+'/expenses/'+d.id).delete();
    await tripRef().delete();try{await mineRef(trip).delete()}catch(e){}
    goHome();msg('旅程已刪除');
  }catch(e){msg('刪除失敗：'+e.message)}
};
$('addM').onclick=async()=>{
  const v=$('nm').value.trim();if(!v)return;
  if(S.members.includes(v)){msg('名字重複了，請加個區分，如「小明2」');return}
  try{await tripRef().update({members:[...S.members,v]});$('nm').value=''}catch(e){msg('新增失敗：'+e.message)}
};
$('nm').onkeydown=e=>{if(e.key==='Enter')$('addM').click()};
$('chips').onclick=async e=>{
  const i=e.target.dataset.rm;if(i===undefined)return;const n=S.members[i];
  if(S.expenses.some(x=>x.payer===n||(x.who||[]).includes(n))&&!await ask(`${n} 已有相關帳目，移除後將不計入結算，確定？`))return;
  try{await tripRef().update({members:S.members.filter((_,k)=>k!=i)})}catch(e){msg('移除失敗：'+e.message)}
};
$('typeSeg').onclick=e=>{const t=e.target.dataset.t;if(!t)return;type=t;[...$('typeSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()};
$('cur').onchange=setRate;
$('base').onchange=async()=>{try{await tripRef().update({base:$('base').value});$('cur').value=$('base').value}catch(e){msg('更改失敗：'+e.message);render()}};
$('save').onclick=async()=>{
  if(S.members.length<2){msg('請先新增至少 2 位成員');return}
  const desc=$('desc').value.trim()||'未命名消費';
  const cents=Math.round(parseFloat($('amount').value)*100);
  if(!(cents>0)){msg('請輸入正確的金額');return}
  const cur=$('cur').value;let rate=1;
  if(cur!==S.base){rate=parseFloat($('rate').value);if(!(rate>0)){msg('請輸入正確的匯率');return}rates[cur]=rate}
  const who=[...document.querySelectorAll('#who input:checked')].map(x=>x.value);
  if(type==='split'&&!who.length){msg('請至少選擇一位分攤的人');return}
  const id='e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  try{
    await db.doc(`trips/${trip}/expenses/${id}`).set({id,ts:Date.now(),desc,cents,cur,rate,payer:$('payer').value,type,who:type==='split'?who:[],cat:$('cat').value,by:me.id});
    $('desc').value='';$('amount').value='';$('log').scrollIntoView({behavior:'smooth'});
  }catch(e){msg('儲存失敗：'+e.message)}
};
$('list').onclick=async e=>{
  const id=e.target.dataset.del;if(!id)return;
  if(await ask('刪除這筆記錄？')){try{await db.doc(`trips/${trip}/expenses/${id}`).delete()}catch(e){msg('刪除失敗：'+e.message)}}
};
$('copy').onclick=async()=>{
  const r=calc();
  let t=`【${S.name} 分帳結算】\n總支出 `+fmt(r.total)+'\n\n';
  S.members.forEach(m=>t+=`${m}：墊付 ${fmt(r.paid[m])}，應分攤 ${fmt(r.owe[m])}\n`);
  t+='\n轉帳方案：\n'+(r.tx.length?r.tx.map(x=>`${x.from} → ${x.to}  ${fmt(x.c)}`).join('\n'):'已結清');
  msg((await copyText(t))?'已複製結算文字':'複製失敗，請手動截圖或選取文字');
};

const opts=CUR.map(c=>`<option value="${c[0]}">${c[0]} ${c[1]}</option>`).join('');
$('base').innerHTML=opts;$('cur').innerHTML=opts;$('tb').innerHTML=opts;
$('gl').onclick=async()=>{
  const p=new GoogleAuthProvider();
  try{await signInWithPopup(auth,p)}
  catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code))signInWithRedirect(auth,p);else if(e.code!=='auth/popup-closed-by-user')msg('登入失敗：'+e.message)}
};
$('so').onclick=async()=>{closeTrip();lastSet(null);await signOut(auth)};
if(!configured){view('blocked');$('gl').style.display='none';$('lp').textContent='尚未設定 Firebase：請依 README.md 把 firebaseConfig 填進 index.html。'}
else onAuthStateChanged(auth,u=>{
  if(!u){closeTrip();view('blocked');return}
  me={id:u.uid,name:(u.displayName||'').trim().slice(0,12)};
  $('hi').textContent=(me.name||'旅人')+'，歡迎回來';
  view('home');loadMine();
  const lt=lastGet();if(lt&&!trip)openTrip(lt);
});
</script>
</body>
</html>
